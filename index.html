            <div
              onClick={() => setIsOrderModalOpen(false)}
              className="fixed inset-0 z-50 bg-black/70 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl max-w-2xl w-full p-6 sm:p-10 shadow-2xl relative transition-colors duration-300"
              >
                <div className="flex items-start justify-between gap-4 mb-8">
                  <div>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-white">Mulai Pesan Desain</h2>
                    <p className="text-zinc-600 dark:text-zinc-400 text-sm mt-1">
                      Isi detail singkat di bawah untuk langsung terhubung ke WhatsApp Setingkat.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsOrderModalOpen(false)}
                    aria-label="Tutup Form Pemesanan"
                    className="p-2 rounded-xl text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800 text-base font-bold transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleWhatsAppOrder} className="space-y-5">
                  <div className="grid sm:grid-cols-2 gap-5">
                    <div>
                      <label className="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-2">Nama Kamu</label>
                      <input
                        type="text"
                        required
                        value={orderName}
                        onChange={(e) => setOrderName(e.target.value)}
                        placeholder="Contoh: Budi Santoso"
                        className="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-amber-500 dark:focus:border-amber-400"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-2">Pilih Layanan</label>
                      <select
                        value={orderService}
                        onChange={(e) => setOrderService(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-amber-500 dark:focus:border-amber-400"
                      >
                        <option>WPAP Portrait (Single / Couple)</option>
                        <option>Desain Poster Event / Promosi</option>
                        <option>Re-Vector / Tracing Logo</option>
                        <option>Custom Desain Grafis Lainnya</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-2">Catatan Konsep / Ukuran</label>
                    <textarea
                      rows="3"
                      value={orderNotes}
                      onChange={(e) => setOrderNotes(e.target.value)}
                      placeholder="Ceritakan singkat konsep warna, ukuran poster, atau deadline yang diinginkan..."
                      className="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-amber-500 dark:focus:border-amber-400"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold text-sm transition-colors"
                  >
                    Kirim Pesanan via WhatsApp →
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Lightbox Detail Karya */}
          {selectedWork && (
            <div
              onClick={() => setSelectedWork(null)}
              className="fixed inset-0 z-50 bg-black/75 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-2xl max-w-3xl w-full overflow-hidden grid md:grid-cols-2 shadow-2xl"
              >
                <div className="aspect-[4/5] bg-zinc-950">
                  {renderArtwork(selectedWork)}
                </div>
                <div className="p-6 flex flex-col justify-between">
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-400/20 dark:bg-amber-400/15 text-amber-700 dark:text-amber-400 border border-amber-400/40 dark:border-amber-400/30">
                        {selectedWork.category}
                      </span>
                      <button
                        onClick={() => setSelectedWork(null)}
                        className="text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white text-sm font-bold px-2 py-1"
                      >
                        ✕
                      </button>
                    </div>
                    <h3 className="text-2xl font-extrabold text-zinc-900 dark:text-white">{selectedWork.title}</h3>
                    <p className="text-sm text-zinc-600 dark:text-zinc-300 leading-relaxed">{selectedWork.description}</p>
                    <div className="space-y-2 pt-3 border-t border-zinc-200 dark:border-zinc-800 text-xs">
                      <p className="text-zinc-500 dark:text-zinc-400"><strong className="text-zinc-800 dark:text-zinc-200">Klien:</strong> {selectedWork.client}</p>
                      <p className="text-zinc-500 dark:text-zinc-400"><strong className="text-zinc-800 dark:text-zinc-200">Tools:</strong> {selectedWork.tools}</p>
                      <p className="text-zinc-500 dark:text-zinc-400"><strong className="text-zinc-800 dark:text-zinc-200">Tahun:</strong> {selectedWork.year}</p>
                    </div>
                  </div>

                  <button
                    type="button"
                    onClick={() => {
                      const cat = selectedWork.category;
                      setSelectedWork(null);
                      openOrderModalWithService(cat);
                    }}
                    className="mt-6 block text-center w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-zinc-950 font-bold text-sm transition-colors"
                  >
                    Pesan Gaya Desain Seperti Ini
                  </button>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
