    /* Animasi Hero Fade-In & Slide-Up */
    @keyframes heroFadeUp {
      0% {
        opacity: 0;
        transform: translateY(24px);
      }
      100% {
        opacity: 1;
        transform: translateY(0);
      }
    }
    .animate-hero-1 {
      animation: heroFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) forwards;
    }
    .animate-hero-2 {
      opacity: 0;
      animation: heroFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.12s forwards;
    }
    .animate-hero-3 {
      opacity: 0;
      animation: heroFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.24s forwards;
    }
    .animate-hero-4 {
      opacity: 0;
      animation: heroFadeUp 0.7s cubic-bezier(0.16, 1, 0.3, 1) 0.36s forwards;
    }
    .animate-hero-card {
      opacity: 0;
      animation: heroFadeUp 0.85s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
    }

    /* Kelas Transisi Scroll-Reveal */
    .reveal-hidden {
      opacity: 0;
      transform: translateY(32px);
      transition: opacity 0.75s cubic-bezier(0.16, 1, 0.3, 1), transform 0.75s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .reveal-visible {
      opacity: 1;
      transform: translateY(0);
    }

</head>

        tools: "Adobe Illustrator",

    function App() {
      const INITIAL_VISIBLE_COUNT = 8;
      const [showAll, setShowAll] = useState(false);
      const [selectedWork, setSelectedWork] = useState(null);
      const [isOrderModalOpen, setIsOrderModalOpen] = useState(false);
      const [isDark, setIsDark] = useState(false);
      const [showGoToTop, setShowGoToTop] = useState(false);

      // State Scroll-Reveal Section "Wujudkan Ide Kamu"
      const [isGalleryVisible, setIsGalleryVisible] = useState(false);
      const gallerySectionRef = useRef(null);

      // State Form Order WhatsApp
      const [orderName, setOrderName] = useState("");
      const [orderService, setOrderService] = useState("WPAP Portrait (Single / Couple)");
      const [orderNotes, setOrderNotes] = useState("");

      useEffect(() => {
        const rootEl = document.documentElement;
        if (isDark) {
          rootEl.classList.add("dark");
        } else {
          rootEl.classList.remove("dark");
        }
      }, [isDark]);

      useEffect(() => {
        const handleScroll = () => {
          setShowGoToTop(window.scrollY > 300);
        };
        window.addEventListener("scroll", handleScroll, { passive: true });
        return () => window.removeEventListener("scroll", handleScroll);
      }, []);

      // IntersectionObserver untuk memunculkan section Wujudkan Ide Kamu saat di-scroll
      useEffect(() => {
        const target = gallerySectionRef.current;
        if (!target) return;

        const observer = new IntersectionObserver(
          (entries) => {
            entries.forEach((entry) => {
              if (entry.isIntersecting) {
                setIsGalleryVisible(true);
                observer.unobserve(entry.target);
              }
            });
          },
          {
            threshold: 0.12,
            rootMargin: "0px 0px -40px 0px"
          }
        );

        observer.observe(target);
        return () => observer.disconnect();
      }, []);

      const scrollToTop = () => {
        window.scrollTo({ top: 0, behavior: "smooth" });
      };

      const displayedItems = showAll
        ? INITIAL_PORTFOLIO
        : INITIAL_PORTFOLIO.slice(0, INITIAL_VISIBLE_COUNT);

        e.preventDefault();
        const phone = "6283163511050";
        const text = `Halo Setingkat! Saya *${orderName || "Klien"}* ingin memesan jasa desain:%0A• *Layanan:* ${orderService}%0A• *Catatan/Konsep:* ${orderNotes || "-"}%0A%0AMohon info estimasi waktu dan harganya ya.`;

        setIsOrderModalOpen(false);
      };

        if (serviceName) {
          setOrderService(serviceName);
        }
        setIsOrderModalOpen(true);
      };

        if (item.imageUrl) {
          return (
            <img
              src={item.imageUrl}
              alt={item.title}
              className="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500"

        if (item.renderType === "poster-1") return <PosterArtSVG variant={1} />;
        return <PosterArtSVG variant={2} />;

            <div className="max-w-6xl mx-auto px-4 sm:px-6 py-16 md:py-24 grid md:grid-cols-12 gap-12 items-center">

                  style={{ transitionDelay: isGalleryVisible ? `${(idx % 4) * 100}ms` : "0ms" }}
                  className={`group cursor-pointer bg-white dark:bg-zinc-900/70 border border-zinc-200 dark:border-zinc-800 hover:border-amber-500 dark:hover:border-amber-400/60 rounded-2xl overflow-hidden shadow-sm hover:shadow-md dark:shadow-none transition-all duration-500 flex flex-col reveal-hidden ${
                    isGalleryVisible ? "reveal-visible" : ""
                  }`}
                >
                  <div className="aspect-[4/5] overflow-hidden bg-zinc-950 relative">
                    {renderArtwork(item)}
                    <div className="absolute top-3 left-3">
                      <span className="px-2.5 py-1 rounded-lg text-[11px] font-bold bg-zinc-950/85 backdrop-blur-sm text-white border border-zinc-700/80">
                        {item.category}
                      </span>
                    </div>
                  </div>
                  <div className="p-4 flex-1 flex flex-col justify-between">
                    <div>
                      <h3 className="font-bold text-zinc-900 dark:text-white text-base group-hover:text-amber-600 dark:group-hover:text-amber-400 transition-colors line-clamp-1">
                        {item.title}
                      </h3>
                      <p className="text-xs text-zinc-500 dark:text-zinc-400 mt-1">{item.client}</p>
                    </div>
                    <div className="mt-4 pt-3 border-t border-zinc-100 dark:border-zinc-800/80 flex items-center justify-between text-xs text-zinc-500 dark:text-zinc-400">
                      <span>{item.year}</span>
                      <span className="text-amber-600 dark:text-amber-400 font-semibold group-hover:translate-x-0.5 transition-transform">
                        Detail →
                      </span>
                    </div>
                  </div>
                </div>
              ))}
            </div>

            {/* Tombol Lihat Lainnya / Tampilkan Lebih Sedikit (Muncul otomatis jika karya > 8) */}
            {INITIAL_PORTFOLIO.length > INITIAL_VISIBLE_COUNT && (
              <div
                style={{ transitionDelay: isGalleryVisible ? "350ms" : "0ms" }}
                className={`mt-12 text-center reveal-hidden ${
                  isGalleryVisible ? "reveal-visible" : ""
                }`}
              >
                <button
                  onClick={() => setShowAll(!showAll)}
                  className="inline-flex items-center gap-2 px-7 py-3.5 rounded-xl bg-white dark:bg-zinc-900 hover:bg-zinc-100 dark:hover:bg-zinc-800 border border-zinc-300 dark:border-zinc-700 hover:border-amber-500 dark:hover:border-amber-400/60 text-zinc-900 dark:text-white font-bold text-sm shadow-sm dark:shadow-none transition-all"
                >
                  {showAll ? (
                    <>
                      Tampilkan Lebih Sedikit ↑
                    </>
                  ) : (
                    <>
                      Lihat Lainnya ({INITIAL_PORTFOLIO.length - INITIAL_VISIBLE_COUNT} Desain Lainnya) ↓
                    </>
                  )}
                </button>
              </div>
            )}
          </section>

          {/* Footer */}
          <footer className="mt-auto border-t border-zinc-200 dark:border-zinc-800/80 py-8 text-center text-xs text-zinc-500">
            <p>© {new Date().getFullYear()} Setingkat. Hak Cipta Dilindungi.</p>
          </footer>

          {/* Tombol Go To Top */}
          {showGoToTop && (
            <button
              type="button"
              onClick={scrollToTop}
              aria-label="Kembali ke Atas"
              title="Kembali ke Atas"
              className="fixed bottom-6 right-6 z-40 p-3.5 rounded-full bg-amber-400 hover:bg-amber-300 text-zinc-950 shadow-lg hover:shadow-xl transition-all duration-300 hover:-translate-y-0.5"
            >
              <svg className="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2.5">
                <path strokeLinecap="round" strokeLinejoin="round" d="M5 15l7-7 7 7" />
              </svg>
            </button>
          )}

          {/* Modal Form Pemesanan WhatsApp */}
          {isOrderModalOpen && (
            <div
              onClick={() => setIsOrderModalOpen(false)}
              className="fixed inset-0 z-50 bg-black/70 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-800 rounded-3xl max-w-2xl w-full p-6 sm:p-10 shadow-2xl relative transition-colors duration-300"
              >
                <div className="flex items-start justify-between gap-4 mb-8">
                  <div>
                    <h2 className="text-2xl sm:text-3xl font-extrabold text-zinc-900 dark:text-white">Yuk, Mulai Desainmu</h2>
                    <p className="text-zinc-600 dark:text-zinc-400 text-sm mt-1">
                      Isi detail singkat di bawah untuk langsung terhubung ke WhatsApp.
                    </p>
                  </div>
                  <button
                    type="button"
                    onClick={() => setIsOrderModalOpen(false)}
                    aria-label="Tutup Form Pemesanan"
                    className="p-2 rounded-xl text-zinc-500 hover:text-zinc-900 hover:bg-zinc-100 dark:text-zinc-400 dark:hover:text-white dark:hover:bg-zinc-800 text-base font-bold transition-colors"
                  >
                    ✕
                  </button>
                </div>

                <form onSubmit={handleWhatsAppOrder} className="space-y-5">
                  <div className="grid sm:grid-cols-2 gap-5">
                    <div>
                      <label className="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-2">Nama Kamu</label>
                      <input
                        type="text"
                        required
                        value={orderName}
                        onChange={(e) => setOrderName(e.target.value)}
                        placeholder="Contoh: Budi Santoso"
                        className="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-amber-500 dark:focus:border-amber-400"
                      />
                    </div>
                    <div>
                      <label className="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-2">Pilih Layanan</label>
                      <select
                        value={orderService}
                        onChange={(e) => setOrderService(e.target.value)}
                        className="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-amber-500 dark:focus:border-amber-400"
                      >
                        <option>WPAP Portrait (Single / Couple)</option>
                        <option>Desain Poster Event / Promosi</option>
                        <option>Re-Vector / Tracing Logo</option>
                        <option>Custom Desain Grafis Lainnya</option>
                      </select>
                    </div>
                  </div>

                  <div>
                    <label className="block text-xs font-semibold text-zinc-700 dark:text-zinc-300 mb-2">Ceritain Ide</label>
                    <textarea
                      rows="3"
                      value={orderNotes}
                      onChange={(e) => setOrderNotes(e.target.value)}
                      placeholder="Buatkan saya desain WPAP pake foto pacar atau ceritakan singkat konsep warna, ukuran poster, atau deadline yang diinginkan..."
                      className="w-full px-4 py-3 rounded-xl bg-zinc-50 dark:bg-zinc-950 border border-zinc-300 dark:border-zinc-800 text-sm text-zinc-900 dark:text-white focus:outline-none focus:border-amber-500 dark:focus:border-amber-400"
                    ></textarea>
                  </div>

                  <button
                    type="submit"
                    className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold text-sm transition-colors"
                  >
                    Kirim Pesanan via WhatsApp →
                  </button>
                </form>
              </div>
            </div>
          )}

          {/* Modal Lightbox Detail Karya */}
          {selectedWork && (
            <div
              onClick={() => setSelectedWork(null)}
              className="fixed inset-0 z-50 bg-black/75 dark:bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-white dark:bg-zinc-900 border border-zinc-200 dark:border-zinc-700 rounded-2xl max-w-3xl w-full overflow-hidden grid md:grid-cols-2 shadow-2xl"
              >
                <div className="aspect-[4/5] bg-zinc-950">
                  {renderArtwork(selectedWork)}
                </div>
                <div className="p-6 flex flex-col justify-between">
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-400/20 dark:bg-amber-400/15 text-amber-700 dark:text-amber-400 border border-amber-400/40 dark:border-amber-400/30">
                        {selectedWork.category}
                      </span>
                      <button
                        onClick={() => setSelectedWork(null)}
                        className="text-zinc-500 hover:text-zinc-900 dark:text-zinc-400 dark:hover:text-white text-sm font-bold px-2 py-1"
                      >
                        ✕
                      </button>
                    </div>
                    <h3 className="text-2xl font-extrabold text-zinc-900 dark:text-white">{selectedWork.title}</h3>
                    <p className="text-sm text-zinc-600 dark:text-zinc-300 leading-relaxed">{selectedWork.description}</p>
                    <div className="space-y-2 pt-3 border-t border-zinc-200 dark:border-zinc-800 text-xs">
                      <p className="text-zinc-500 dark:text-zinc-400"><strong className="text-zinc-800 dark:text-zinc-200">Klien:</strong> {selectedWork.client}</p>
                      <p className="text-zinc-500 dark:text-zinc-400"><strong className="text-zinc-800 dark:text-zinc-200">Tools:</strong> {selectedWork.tools}</p>
                      <p className="text-zinc-500 dark:text-zinc-400"><strong className="text-zinc-800 dark:text-zinc-200">Tahun:</strong> {selectedWork.year}</p>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
