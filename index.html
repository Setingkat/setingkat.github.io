                  <h3 className="text-xl font-bold text-white">Re-Vector & Custom Grafis</h3>
                  <p className="text-sm text-zinc-400 leading-relaxed">
                    Tracing ulang logo pecah menjadi vektor tajam, pembuatan feed media sosial, serta kebutuhan grafis branding usaha.
                  </p>
                  <ul className="text-xs text-zinc-300 space-y-2 pt-2 border-t border-zinc-800">
                    <li>✓ Hasil Tajam Tanpa Pecah Saat Diperbesar</li>
                    <li>✓ Pengerjaan Cepat & Komunikatif</li>
                    <li>✓ Paket Bundling Konten</li>
                  </ul>
                </div>
              </div>
            </div>
          </section>

          {/* Form Pemesanan WhatsApp */}
          <section id="pesan" className="max-w-4xl mx-auto px-4 sm:px-6 py-20 w-full">
            <div className="bg-zinc-900 border border-zinc-800 rounded-3xl p-6 sm:p-10">
              <div className="mb-8">
                <h2 className="text-2xl sm:text-3xl font-extrabold text-white">Mulai Pesan Desain</h2>
                <p className="text-zinc-400 text-sm mt-1">
                  Isi detail singkat di bawah untuk langsung terhubung ke WhatsApp Setingkat.
                </p>
              </div>

              <form onSubmit={handleWhatsAppOrder} className="space-y-5">
                <div className="grid sm:grid-cols-2 gap-5">
                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 mb-2">Nama Kamu</label>
                    <input
                      type="text"
                      required
                      value={orderName}
                      onChange={(e) => setOrderName(e.target.value)}
                      placeholder="Contoh: Budi Santoso"
                      className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-white focus:outline-none focus:border-amber-400"
                    />
                  </div>
                  <div>
                    <label className="block text-xs font-semibold text-zinc-300 mb-2">Pilih Layanan</label>
                    <select
                      value={orderService}
                      onChange={(e) => setOrderService(e.target.value)}
                      className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-white focus:outline-none focus:border-amber-400"
                    >
                      <option>WPAP Portrait (Single / Couple)</option>
                      <option>Desain Poster Event / Promosi</option>
                      <option>Re-Vector / Tracing Logo</option>
                      <option>Custom Desain Grafis Lainnya</option>
                    </select>
                  </div>
                </div>

                <div>
                  <label className="block text-xs font-semibold text-zinc-300 mb-2">Catatan Konsep / Ukuran</label>
                  <textarea
                    rows="3"
                    value={orderNotes}
                    onChange={(e) => setOrderNotes(e.target.value)}
                    placeholder="Ceritakan singkat konsep warna, ukuran poster, atau deadline yang diinginkan..."
                    className="w-full px-4 py-3 rounded-xl bg-zinc-950 border border-zinc-800 text-sm text-white focus:outline-none focus:border-amber-400"
                  ></textarea>
                </div>

                <button
                  type="submit"
                  className="w-full sm:w-auto px-8 py-3.5 rounded-xl bg-emerald-500 hover:bg-emerald-400 text-zinc-950 font-extrabold text-sm transition-colors"
                >
                  Kirim Pesanan via WhatsApp →
                </button>
              </form>
            </div>
          </section>

          {/* Footer */}
          <footer className="mt-auto border-t border-zinc-800/80 py-8 text-center text-xs text-zinc-500">
            <p>© {new Date().getFullYear()} Setingkat Creative Studio. Hak Cipta Dilindungi.</p>
          </footer>

          {/* Modal Lightbox Detail Karya */}
          {selectedWork && (
            <div
              onClick={() => setSelectedWork(null)}
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-3xl w-full overflow-hidden grid md:grid-cols-2 shadow-2xl"
              >
                <div className="aspect-[4/5] bg-zinc-950">
                  {renderArtwork(selectedWork)}
                </div>
                <div className="p-6 flex flex-col justify-between">
                  <div className="space-y-4">
                    <div className="flex items-center justify-between">
                      <span className="px-3 py-1 rounded-full text-xs font-bold bg-amber-400/15 text-amber-400 border border-amber-400/30">
                        {selectedWork.category}
                      </span>
                      <button
                        onClick={() => setSelectedWork(null)}
                        className="text-zinc-400 hover:text-white text-sm font-bold px-2 py-1"
                      >
                        ✕
                      </button>
                    </div>
                    <h3 className="text-2xl font-extrabold text-white">{selectedWork.title}</h3>
                    <p className="text-sm text-zinc-300 leading-relaxed">{selectedWork.description}</p>
                    <div className="space-y-2 pt-3 border-t border-zinc-800 text-xs">
                      <p className="text-zinc-400"><strong className="text-zinc-200">Klien:</strong> {selectedWork.client}</p>
                      <p className="text-zinc-400"><strong className="text-zinc-200">Tools:</strong> {selectedWork.tools}</p>
                      <p className="text-zinc-400"><strong className="text-zinc-200">Tahun:</strong> {selectedWork.year}</p>
                    </div>
                  </div>

                  <a
                    href="#pesan"
                    onClick={() => {
                      setOrderService(selectedWork.category);
                      setSelectedWork(null);
                    }}
                    className="mt-6 block text-center w-full py-3 rounded-xl bg-amber-400 hover:bg-amber-300 text-zinc-950 font-bold text-sm transition-colors"
                  >
                    Pesan Gaya Desain Seperti Ini
                  </a>
                </div>
              </div>
            </div>
          )}

          {/* Modal Simulasi Tambah Karya */}
          {showAddModal && (
            <div
              onClick={() => setShowAddModal(false)}
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4"
            >
              <div
                onClick={(e) => e.stopPropagation()}
                className="bg-zinc-900 border border-zinc-700 rounded-2xl max-w-md w-full p-6 space-y-4"
              >
                <div className="flex items-center justify-between">
                  <h3 className="text-lg font-bold text-white">Simulasi Tambah Karya ke Galeri</h3>
                  <button onClick={() => setShowAddModal(false)} className="text-zinc-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleAddItem} className="space-y-3">
                  <div>
                    <label className="block text-xs text-zinc-400 mb-1">Judul Karya</label>
                    <input
                      type="text"
                      required
                      value={newTitle}
                      onChange={(e) => setNewTitle(e.target.value)}
                      placeholder="Contoh: WPAP Wajah Tokoh"
                      className="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-zinc-400 mb-1">Kategori</label>
                    <select
                      value={newCategory}
                      onChange={(e) => setNewCategory(e.target.value)}
                      className="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 text-sm text-white"
                    >
                      <option>WPAP Art</option>
                      <option>Desain Poster</option>
                      <option>Branding & Event</option>
                    </select>
                  </div>
                  <div>
                    <label className="block text-xs text-zinc-400 mb-1">URL Gambar (Opsional)</label>
                    <input
                      type="url"
                      value={newImageUrl}
                      onChange={(e) => setNewImageUrl(e.target.value)}
                      placeholder="https://... (kosongkan untuk memakai vektor bawaan)"
                      className="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 text-sm text-white"
                    />
                  </div>
                  <div>
                    <label className="block text-xs text-zinc-400 mb-1">Deskripsi Singkat</label>
                    <textarea
                      rows="2"
                      value={newDesc}
                      onChange={(e) => setNewDesc(e.target.value)}
                      placeholder="Keterangan singkat karya..."
                      className="w-full px-3 py-2 rounded-lg bg-zinc-950 border border-zinc-800 text-sm text-white"
                    ></textarea>
                  </div>
                  <button
                    type="submit"
                    className="w-full py-2.5 rounded-xl bg-amber-400 hover:bg-amber-300 text-zinc-950 font-bold text-sm"
                  >
                    Tampilkan di Galeri
                  </button>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>
</body>
</html>
